<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Australian Food Exports</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>

<body>

  <header class="hero">
    <h1>Australian Food Exports</h1>
    <p>What Australia sells, where it goes, and how it is changing.</p>
  </header>

  <main>

    <section id="scale">
      <h2>Scale</h2>
      <div id="chart1" class="chart-container"></div>
    </section>

    <section id="product-mix">
      <h2>Product Mix</h2>
      <div id="chart2" class="chart-container"></div>
      <div id="chart3" class="chart-container"></div>
      <div id="chart4" class="chart-container"></div>
    </section>

    <section id="destinations">
      <h2>Destinations</h2>
      <div id="chart5" class="chart-container"></div>
      <div id="chart6" class="chart-container"></div>
      <div id="chart7" class="chart-container"></div>
    </section>

    <section id="malaysia">
      <h2>Malaysia and ASEAN</h2>
      <div id="chart8" class="chart-container"></div>
      <div id="chart9" class="chart-container"></div>
    </section>

    <section id="dependence">
      <h2>Export Dependence</h2>
      <div id="chart10" class="chart-container"></div>
      <div id="chart11" class="chart-container"></div>
    </section>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
